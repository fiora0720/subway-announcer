```html
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>지하철 안내 방송</title>

<style>

body{
background:#0b0b0b;
color:white;
font-family:Arial;
text-align:center;
padding:40px;
}

select,button{
font-size:18px;
padding:6px;
margin:6px;
}

.lcd{
margin:30px auto;
width:500px;
padding:30px;
background:black;
color:#00ff66;
font-size:22px;
border:5px solid #222;
line-height:1.7;
}

</style>
</head>

<body>

<h1>🚇 지하철 안내 방송 시스템</h1>

행선지
<select id="dest">
<option>청량리</option>
<option>서울역</option>
<option>왕십리</option>
<option>도심</option>
</select>

<br>

이번 역
<select id="station">
<option>왕십리</option>
<option>청량리</option>
<option>서울역</option>
<option>도심</option>
</select>

<br>

내리실 문
<select id="door">
<option value="왼쪽">왼쪽</option>
<option value="오른쪽">오른쪽</option>
</select>

<br><br>

<button onclick="play()">안내방송 재생</button>

<div class="lcd" id="lcd">

안내방송 대기중

</div>

<script>

function play(){

let station=document.getElementById("station").value
let door=document.getElementById("door").value
let dest=document.getElementById("dest").value

let text=
"이번 역은 "+station+", "+station+"역입니다. "+
"내리실 문은 "+door+"입니다. "+
"내리실 때에는 발밑을 조심하시기 바랍니다. "+
"이 열차는 "+dest+"행 열차입니다."

document.getElementById("lcd").innerText=text

let speech=new SpeechSynthesisUtterance(text)

speech.lang="ko-KR"
speech.rate=0.9

speechSynthesis.speak(speech)

}

</script>

</body>
</html>
```
