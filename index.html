```html
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>지하철 안내 방송</title>

<style>

body{
background:#111;
color:white;
font-family:monospace;
text-align:center;
padding:40px;
}

select,button{
font-size:18px;
padding:6px;
margin:6px;
}

.board{

background:black;
border:6px solid #222;
width:600px;
margin:40px auto;
padding:30px;

font-size:28px;
line-height:1.8;

}

.green{
color:#00ff66;
}

.yellow{
color:#ffd400;
}

.red{
color:#ff3333;
}

</style>
</head>

<body>

<h2>🚇 지하철 안내 방송</h2>

이번 역

<select id="station">
<option>왕십리</option>
<option>청량리</option>
<option>서울역</option>
</select>

내리실 문

<select id="door">
<option value="왼쪽">왼쪽</option>
<option value="오른쪽">오른쪽</option>
</select>

<br>

<button onclick="play()">방송 재생</button>

<div class="board" id="board">

<div class="green">
이번역 : 왕십리
</div>

<div>
<span class="green">열차가</span>
<span class="red">잠시후</span>
<span class="green">도착합니다</span>
</div>

</div>

<script>

function play(){

let station=document.getElementById("station").value
let door=document.getElementById("door").value

let text=
"이번 역은 "+station+"역입니다. "+
"내리실 문은 "+door+"입니다."

let boardHTML=
"<div class='yellow'>이번역 : "+station+"</div>"+
"<div><span class='green'>열차가 </span>"+
"<span class='red'>잠시후 </span>"+
"<span class='green'>도착합니다</span></div>"

document.getElementById("board").innerHTML=boardHTML

let speech=new SpeechSynthesisUtterance(text)

speech.lang="ko-KR"
speech.rate=0.9

speechSynthesis.speak(speech)

}

</script>

</body>
</html>
